name: CI/CD Pipeline

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # 同一PRへの連続pushのみ先行runをキャンセル。main/developへのpushは完了まで実行する
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 基本的なlintとタイプチェック
  lint-and-type-check:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Check Prettier formatting
        run: npx prettier --check "src/**/*.{ts,tsx,js,jsx,json,css,md}"

  # セキュリティ監査
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit --audit-level=high

  # 複数Node.jsバージョンでのテスト
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version: [16, 18, 20]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --watchAll=false

  # カバレッジ生成（deployment-check用）
  coverage:
    name: Generate Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:ci

      - name: Debug - Verify coverage directory
        run: |
          echo "Listing coverage directory..."
          ls -laR coverage/ || echo "Coverage directory not found after tests"
          echo "Current directory:"
          ls -la
          echo "Coverage summary content:"
          if [ -f coverage/coverage-summary.json ]; then
            cat coverage/coverage-summary.json
          else
            echo "coverage-summary.json NOT FOUND"
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage/coverage-summary.json
            coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

  # ビルドテスト
  build:
    name: Build Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint-and-type-check]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Debug - Verify build directory
        run: |
          echo "Listing build directory..."
          ls -la build/ || echo "Build directory not found"
          echo "Build directory size:"
          du -sh build/ || echo "Cannot measure build size"

      - name: Check build size
        run: |
          echo "Build completed successfully!"
          du -sh build/
          find build -name "*.js" -exec wc -c {} + | sort -n

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-files
          path: build
          if-no-files-found: error
          retention-days: 7

  # デプロイメント準備チェック（実質的な品質ゲート）
  # test:ci / build の再実行はせず、各ジョブの成果物を再利用する
  # !cancelled() で上流ジョブ失敗時もサマリーを出力し、最終ステップでジョブを失敗させる
  deployment-check:
    name: Deployment Readiness
    runs-on: ubuntu-latest
    needs: [lint-and-type-check, test, coverage, build, security-audit]
    if: ${{ !cancelled() }}
    timeout-minutes: 30
    env:
      COVERAGE_THRESHOLD: 30
      MAX_BUNDLE_SIZE_MB: 1.25

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Download coverage artifacts
        if: ${{ needs.coverage.result == 'success' }}
        uses: actions/download-artifact@v7
        with:
          name: coverage-report
          path: coverage

      - name: Download build artifacts
        if: ${{ needs.build.result == 'success' }}
        uses: actions/download-artifact@v7
        with:
          name: build-files
          path: build

      - name: Check test coverage threshold
        id: coverage
        if: ${{ needs.coverage.result == 'success' }}
        run: node scripts/check-coverage.js

      - name: Check bundle size
        id: bundle-size
        if: ${{ needs.build.result == 'success' }}
        run: node scripts/check-bundle-size.js

      - name: Quality gate summary
        if: ${{ !cancelled() }}
        run: |
          echo ""
          echo "📊 Quality Gate Report"
          echo "═══════════════════════════════════════"
          echo "Test (Node matrix): ${{ needs.test.result }}"
          echo "Coverage (>=${COVERAGE_THRESHOLD}%): ${{ steps.coverage.outcome || 'skipped' }}"
          echo "Bundle Size (<=${MAX_BUNDLE_SIZE_MB}MB): ${{ steps.bundle-size.outcome || 'skipped' }}"
          echo "TypeScript: ${{ needs.lint-and-type-check.result }}"
          echo "Security Audit: ${{ needs.security-audit.result }}"
          echo "═══════════════════════════════════════"

      - name: Fail if any upstream gate failed
        if: ${{ !cancelled() }}
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          for result in $results; do
            if [ "$result" != "success" ]; then
              echo "❌ Upstream gate did not succeed: $result"
              exit 1
            fi
          done
