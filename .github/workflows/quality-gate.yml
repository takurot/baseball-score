name: Security & Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # 毎週月曜日の午前0時（UTC）に実行
    - cron: '0 0 * * 1'

jobs:
  # CodeQL セキュリティ分析
  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:javascript'

  # 依存関係の脆弱性スキャン
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate

  # SAST（Static Application Security Testing）
  sast-scan:
    name: SAST Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint security rules
        run: npx eslint . --ext .ts,.tsx,.js,.jsx --max-warnings 0

      - name: Security audit
        run: npm audit --audit-level=moderate --json > audit-report.json

      - name: Upload audit report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: security-audit-report
          path: audit-report.json
          retention-days: 30

      - name: Check audit results
        if: always()
        run: |
          if [ -f audit-report.json ]; then
            echo "📊 Security Audit Summary"
            echo "═══════════════════════════════════════"
            node -e "
              const report = require('./audit-report.json');
              const vulnerabilities = report.metadata?.vulnerabilities || {};
              const counts = {
                critical: vulnerabilities.critical || 0,
                high: vulnerabilities.high || 0,
                moderate: vulnerabilities.moderate || 0,
                low: vulnerabilities.low || 0,
                info: vulnerabilities.info || 0,
              };
              console.log('Critical:', counts.critical);
              console.log('High:', counts.high);
              console.log('Moderate:', counts.moderate);
              console.log('Low:', counts.low);
              console.log('Info:', counts.info);
              const blocking = counts.critical + counts.high + counts.moderate;
              if (blocking > 0) {
                console.error('❌ vulnerabilities at or above moderate: ' + blocking);
                process.exit(1);
              }
              console.log('✅ No vulnerabilities at or above moderate');
            "
            echo "═══════════════════════════════════════"
          else
            echo "❌ audit-report.json not found"
            exit 1
          fi

