name: Security & Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # 毎週月曜日の午前0時（UTC）に実行
    - cron: '0 0 * * 1'

concurrency:
  # scheduled run はユニークグループで必ず実行。それ以外は ref 単位とし、
  # 同一PRへの連続pushのみ先行runをキャンセル（mainへのpushは完了まで実行）
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # CodeQL セキュリティ分析
  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: javascript
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: '/language:javascript'

  # 依存関係の脆弱性スキャン
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  # SAST（Static Application Security Testing）
  sast-scan:
    name: SAST Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint security rules
        run: npx eslint . --ext .ts,.tsx,.js,.jsx --max-warnings 0

      - name: Security audit
        id: audit
        run: npm audit --audit-level=moderate --json > audit-report.json

      - name: Upload audit report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: security-audit-report
          path: audit-report.json
          retention-days: 30

      - name: Check audit results
        if: ${{ !cancelled() && steps.audit.outcome != 'skipped' }}
        run: |
          if [ -f audit-report.json ]; then
            echo "📊 Security Audit Summary"
            echo "═══════════════════════════════════════"
            node -e "
              let failed = false;
              let report = null;
              try {
                report = require('./audit-report.json');
              } catch (error) {
                console.error('❌ Failed to parse audit-report.json: ' + error.message);
                failed = true;
              }
              if (report) {
                if (report.error) {
                  console.error('❌ npm audit error: ' + (report.error.summary || report.error.code || 'unknown'));
                  failed = true;
                } else if (!report.metadata?.vulnerabilities) {
                  console.error('❌ Unexpected audit report format: metadata.vulnerabilities is missing');
                  failed = true;
                } else {
                  const vulnerabilities = report.metadata.vulnerabilities;
                  const counts = {
                    critical: vulnerabilities.critical || 0,
                    high: vulnerabilities.high || 0,
                    moderate: vulnerabilities.moderate || 0,
                    low: vulnerabilities.low || 0,
                    info: vulnerabilities.info || 0,
                  };
                  console.log('Critical:', counts.critical);
                  console.log('High:', counts.high);
                  console.log('Moderate:', counts.moderate);
                  console.log('Low:', counts.low);
                  console.log('Info:', counts.info);
                  const blocking = counts.critical + counts.high + counts.moderate;
                  if (blocking > 0) {
                    console.error('❌ vulnerabilities at or above moderate: ' + blocking);
                    failed = true;
                  } else {
                    console.log('✅ No vulnerabilities at or above moderate');
                  }
                }
              }
              process.exitCode = failed ? 1 : 0;
            "
            echo "═══════════════════════════════════════"
          else
            echo "❌ audit-report.json not found (audit ran but produced no report)"
            exit 1
          fi

