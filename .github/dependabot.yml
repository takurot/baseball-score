version: 2
updates:
  # npm依存関係の更新
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'Asia/Tokyo'
    open-pull-requests-limit: 10
    reviewers:
      - 'takurot'
    assignees:
      - 'takurot'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'javascript'
    groups:
      mui:
        patterns:
          - '@mui/*'
    ignore:
      # eslint-plugin-jest v28+ は @typescript-eslint v6+ を要求
      # 現在は v5.62.0 を使用しているため互換性がない
      - dependency-name: 'eslint-plugin-jest'
        update-types: ['version-update:semver-major']
      # TypeScript ESLint v8+ は破壊的変更が多く、
      # react-scripts のアップデートが必要
      - dependency-name: '@typescript-eslint/*'
        update-types: ['version-update:semver-major']
      # TypeScript v5+ は react-scripts 5.0.1 と互換性がない
      # react-scripts は "^3.2.1 || ^4" のみサポート
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # React v19+ は破壊的変更が多く、慎重な検証が必要
      # 全体的なエコシステムアップデートが必要
      - dependency-name: 'react'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-dom'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/react'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/react-dom'
        update-types: ['version-update:semver-major']
      # MUI v7+ は破壊的変更があり、段階的アップデートが必要
      # @mui/icons-material とバージョン同期が必要
      - dependency-name: '@mui/material'
        update-types: ['version-update:semver-major']
      - dependency-name: '@mui/icons-material'
        update-types: ['version-update:semver-major']
      # web-vitals v5+ は破壊的変更が多い
      # getFID()関数削除、ReportHandler型変更など
      - dependency-name: 'web-vitals'
        update-types: ['version-update:semver-major']

  # GitHub Actions ワークフローの更新
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'Asia/Tokyo'
    open-pull-requests-limit: 5
    reviewers:
      - 'takurot'
    assignees:
      - 'takurot'
    commit-message:
      prefix: 'ci'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'github-actions'
