version: 2
updates:
  # npm依存関係の更新
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'Asia/Tokyo'
    open-pull-requests-limit: 10
    reviewers:
      - 'takurot'
    assignees:
      - 'takurot'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'javascript'
    groups:
      mui:
        patterns:
          - '@mui/*'
          - '@emotion/*'
    ignore:
      # react-scripts は peer として TypeScript ^4 までしか宣言していないため
      # メジャーアップデートは react-scripts 移行後に検討（現行は ^5.9.3 を使用中）
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # React v19+ は破壊的変更が多く、慎重な検証が必要
      # 全体的なエコシステムアップデートが必要
      - dependency-name: 'react'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-dom'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/react'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/react-dom'
        update-types: ['version-update:semver-major']
      # MUI v7+ は破壊的変更があり、段階的アップデートが必要
      # @mui/icons-material とバージョン同期が必要
      - dependency-name: '@mui/material'
        update-types: ['version-update:semver-major']
      - dependency-name: '@mui/icons-material'
        update-types: ['version-update:semver-major']
      # web-vitals v5+ は破壊的変更が多い
      # getFID()関数削除、ReportHandler型変更など
      - dependency-name: 'web-vitals'
        update-types: ['version-update:semver-major']

  # GitHub Actions ワークフローの更新
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'Asia/Tokyo'
    open-pull-requests-limit: 5
    reviewers:
      - 'takurot'
    assignees:
      - 'takurot'
    commit-message:
      prefix: 'ci'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'github-actions'
